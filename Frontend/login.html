<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CampusBuzz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="image/logo.png">
<link rel="b5" href="C:\Users\DHRUV\OneDrive\Desktop\bootstrap-5.0.2-dist\bootstrap-5.0.2-dist\css\bootstrap.min.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  color:#fff;
  background:
  linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
  url("image/event.jpg") no-repeat center center fixed; 
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

.navbar{
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 60px;
  box-shadow:0 0 20px rgba(255,0,255,0.4);
  position:sticky;
  top:0;
  z-index:100;
  animation:fadeUp 0.8s ease forwards;
}

.logo{
  font-weight:600;
  font-size:30px;
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(45deg,#ff00cc,#3333ff,#00ffff);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.img-logo{
  width:70px;
  height:70px;
  object-fit:cover;
}

.nav-links a{
  margin-left:25px;
  text-decoration:none;
  color:#ddd;
  font-size:14px;
  transition:all 0.3s ease;
  padding:6px 14px;
  border-radius:20px;
}

.nav-links a:hover,
.nav-links a.active{
  background:linear-gradient(45deg,#ff00cc,#3333ff);
  color:#fff;
  box-shadow:0 0 15px #ff00cc;
}

.password-wrapper{
  position:relative;
  margin-bottom:15px;
}

.password-wrapper input{
  width:100%;
  padding:12px 45px 12px 15px;
}

.toggle-password{
  position:absolute;
  right:15px;
  top: 25px;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:18px;
  color:#000000;
  transition:0.3s;
}

.login-section{
  display:flex;
  justify-content:center;
  align-items:center;
  height:85vh;
}

.login-box{
  width:100%;
  max-width:400px;
  background:rgba(255,255,255,0.08);
  padding:40px;
  border-radius:18px;
 border:1px solid rgba(0,255,255,0.2);
 box-shadow:0 0 35px rgba(0,255,255,0.25);
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.login-box h2{
  text-align:center;
  margin-bottom:20px;
  font-size:24px;
  background:linear-gradient(45deg,#00ffff,#ff00cc);
  background-clip:text;
  color:transparent;
}

.login-box input{
  width:100%;
  padding:12px 15px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.1);
  color:#fff;
  outline:none;
  transition:0.3s;
}

.login-box input:focus{
  border-color:#00ffff;
  box-shadow:0 0 15px #00ffff;
}

.login-box button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:25px;
  background:linear-gradient(45deg,#ff00cc,#00ffff);
  color:#fff;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 20px rgba(0,255,255,0.6);
}

.login-box button:hover{
  transform:scale(1.08);
  box-shadow:0 0 35px #00ffff;
}

.register-link{
  text-align:center;
  margin-top:15px;
}

.register-link a{
  color:#00ffff;
  text-decoration:none;
}

.register-link a:hover{
  text-shadow:0 0 10px #00ffff;
}

@media(max-width:768px){
  .navbar{
    flex-direction:column;
    padding:15px 20px;
  }

  .nav-links{
    margin-top:10px;
  }

  .nav-links a{
    margin:5px 10px 0 0;
  }
}
</style>
</head>

<body>

<script src="C:\Users\DHRUV\OneDrive\Desktop\bootstrap-5.0.2-dist\bootstrap-5.0.2-dist\js\bootstrap.bundle.min.js"></script>

<div class="navbar">
  <div class="logo">
      <img src="image/logo.png" alt="logo" class="img-logo">
      CampusBuzz
  </div>

  <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="results.html">Results</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
      <a class="active" href="login.html">Login</a>
  </div>
</div>

<section class="login-section">
  <div class="login-box">
    <h2>Login Account</h2>
    <form onsubmit="redirectToHome(event)">

  <input type="email" placeholder="Email Address" required>

  <div class="password-wrapper">
    <input type="password" id="password" placeholder="Password" required>
    <span class="toggle-password" onclick="togglePassword()">👁</span>
  </div>

  <button type="submit">Login</button>

</form>

    <div class="register-link">
      Don't have an account?
      <a href="register.html">Register Here</a>
    </div>
  </div>
</section>

<script>
function redirectToHome(event){
  event.preventDefault(); 
  setTimeout(()=>{
    window.location.href = "index.html";
  }, 800);
}

function togglePassword(){
  const password = document.getElementById("password");
  password.type = password.type === "password" ? "text" : "password";
}

</script>

</body>
</html>
