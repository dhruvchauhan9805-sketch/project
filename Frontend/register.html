<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="image/logo.png">
<link rel="stylesheet" href="bootstrap.min.css">
<link rel="b5" href="C:\Users\DHRUV\OneDrive\Desktop\bootstrap-5.0.2-dist\bootstrap-5.0.2-dist\css\bootstrap.min.css">

<style>
*{
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  margin:0;
  background:linear-gradient(135deg,#0f0c29,#302b63,#1a1a2e);
  color:#fff;
  background:
  linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
  url("image/event.jpg") no-repeat center center fixed; 
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

.page{
  max-width:800px;
  margin:40px auto;
  animation:fadeUp 0.8s ease forwards;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

.back{
  display:inline-block;
  margin-bottom:20px;
  text-decoration:none;
  color:#fff;
  font-size:14px;
  transition:0.3s;
}
.back:hover{
  color:#00ffff;
  text-shadow:0 0 10px #00ffff;
}

.container{
  background:rgba(255,255,255,0.06);
  padding:40px;
  border-radius:18px;
  border:1px solid rgba(0,255,255,0.2);
  backdrop-filter:blur(12px);
  box-shadow:0 0 35px rgba(0,255,255,0.25);
}

h2{
  margin:0 0 6px;
  font-size:22px;
  background:linear-gradient(45deg,#ff00cc,#00ffff,#ffcc00);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

p{
  color:#ccc;
  font-size:14px;
  margin-bottom:25px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

input,select{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:#fff;
  font-size:14px;
  outline:none;
}

input::placeholder{
  color:#bbb;
}

input:focus, select:focus{
  border-color:#00ffff;
  box-shadow:0 0 10px rgba(0,255,255,0.6);
}

.error{
  margin-top:18px;
  color:#ff4d6d;
  font-size:14px;
}

.actions{
  display:flex;
  gap:18px;
  margin-top:30px;
}

button{
  flex:1;
  padding:14px;
  border-radius:12px;
  font-size:15px;
  cursor:pointer;
  transition:all 0.3s ease;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.08);
  color:#fff;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(255,0,255,0.6);
}

#city option{
  background:#1a1a2e;
  color:#fff;
}

@media(max-width:768px){
  .form-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<script src="C:\Users\DHRUV\OneDrive\Desktop\bootstrap-5.0.2-dist\bootstrap-5.0.2-dist\js\bootstrap.bundle.min.js"></script>

<div class="page">

<a class="back" href="login.html">← Back to Login Page</a>

<div class="container">
<h2>Create Your Account</h2>
<p>Fill out the form below to register for login access.</p>

<form id="registerForm">

<div class="form-grid">
<input type="text" id="name" placeholder="Full Name *" required>
<input type="email" id="email" placeholder="Email Address *" required>
<input type="text" id="phone" placeholder="Phone Number *" required>
<input type="password" id="password" placeholder="Password *" required>
<input type="password" id="confirmPassword" placeholder="Confirm Password *" required>

<select id="city" required>
<option value="">Select Your City *</option>
<option>Ahmedabad</option>
<option>Surat</option>
<option>Vadodara</option>
<option>Rajkot</option>
<option>Bhavnagar</option>
<option>Jamnagar</option>
<option>Gandhinagar</option>
<option>Junagadh</option>
<option>Gandhidham</option>
<option>Anand</option>
<option>Navsari</option>
<option>Morbi</option>
<option>Nadiad</option>
<option>Surendranagar</option>
<option>Bharuch</option>
<option>Mehsana</option>
<option>Bhuj</option>
<option>Porbandar</option>
<option>Palanpur</option>
<option>Valsad</option>
<option>Vapi</option>
<option>Gondal</option>
<option>Veraval</option>
<option>Godhra</option>
<option>Patan</option>
<option>Kalol</option>
<option>Dahod</option>
<option>Botad</option>
<option>Amreli</option>
<option>Deesa</option>
<option>Other</option>
</select>
</div>

<div class="error" id="error"></div>

<div class="actions">
<button type="button" onclick="history.back()">Cancel</button>
<button type="submit">Register</button>
</div>

</form>
</div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){

  e.preventDefault();

  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let password = document.getElementById("password").value;
  let confirmPassword = document.getElementById("confirmPassword").value;
  let city = document.getElementById("city").value;
  let error = document.getElementById("error");

  error.innerText = "";

  if(!name || !email || !phone || !password || !confirmPassword || !city){
    error.innerText = "❌ Please fill all required fields";
    return;
  }

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    error.innerText = "❌ Invalid email address";
    return;
  }

  if(!/^\d{10}$/.test(phone)){
    error.innerText = "❌ Phone number must be exactly 10 digits";
    return;
  }

  if(password.length < 6){
    error.innerText = "❌ Password must be at least 6 characters";
    return;
  }

  if(password !== confirmPassword){
    error.innerText = "❌ Passwords do not match";
    return;
  }

  alert("✅ Registration Successful! You can now login.");
  window.location.href = "login.html";
});

</script>

</body>
</html>
