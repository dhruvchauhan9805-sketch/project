<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event Registration | CampusBuzz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="image/logo.png">
<link rel="stylesheet" href="C:\Users\DHRUV\OneDrive\Desktop\bootstrap-5.0.2-dist\bootstrap-5.0.2-dist\css\bootstrap.min.css">

<style>
*{
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  margin:0;
  background:linear-gradient(135deg,#0f0c29,#302b63,#1a1a2e);
  color:#fff;
}

.page{
  max-width:1000px;
  margin:40px auto;
  animation: fadeUp 0.8s ease forwards;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(30px)}
  to{opacity:1; transform:translateY(0)}
}

.back{
  display:inline-block;
  margin-bottom:20px;
  text-decoration:none;
  color:#fff;
  font-size:14px;
  transition:0.3s;
}
.back:hover{
  color:#00ffff;
  text-shadow:0 0 10px #00ffff;
}

.container{
  background:rgba(255,255,255,0.06);
  padding:40px;
  border-radius:18px;
  border:1px solid rgba(0,255,255,0.2);
  backdrop-filter:blur(12px);
  box-shadow:0 0 35px rgba(0,255,255,0.25);
  animation: cardPop 0.6s ease forwards;
}

@keyframes cardPop{
  from{opacity:0; transform:scale(0.95)}
  to{opacity:1; transform:scale(1)}
}

h2{
  margin:0 0 6px;
  font-size:22px;
  background:linear-gradient(45deg,#ff00cc,#00ffff,#ffcc00);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

p{
  color:#ccc;
  font-size:14px;
  margin-bottom:25px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

input,select,textarea{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:#fff;
  font-size:14px;
  outline:none;
  transition:all 0.3s ease;
}

input::placeholder,
textarea::placeholder{
  color:#bbb;
}

#year,#dept{
  border:1px solid rgba(0,255,255,0.4);
}

#year:hover,#dept:hover{
  box-shadow:0 0 20px rgba(255,0,255,0.6);
  transform:translateY(-2px);
}

#year:focus,#dept:focus,
input:focus,textarea:focus{
  border-color:#00ffff;
  box-shadow:0 0 20px rgba(0,255,255,0.5);
  transform:translateY(-3px);
}

#year option,#dept option{
  background:#1a1a2e;
  color:#fff;
}

textarea{
  grid-column:span 2;
  resize:none;
}

.error{
  margin-top:18px;
  color:#ff4d6d;
  font-size:14px;
}

.actions{
  display:flex;
  gap:18px;
  margin-top:30px;
}

button{
  flex:1;
  padding:14px;
  border-radius:12px;
  font-size:15px;
  cursor:pointer;
  transition:all 0.3s ease;
}

.cancel{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  color:#fff;
}

.submit{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  color: #fff;
}
.submit:hover{
  box-shadow:0 0 20px rgba(255,0,255,0.6);
}

.cancel:hover{ 
  box-shadow:0 0 20px rgba(255,0,255,0.6);
}

button:hover{
  transform:translateY(-3px);
}

@media(max-width:768px){
  .form-grid{
    grid-template-columns:1fr;
  }
  textarea{
    grid-column:span 1;
  }
}

footer{
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  text-align:center;
  padding:20px 10px;
  font-size:14px;
  border-top:1px solid rgba(255,255,255,0.1);
  margin-top:50px;

  background-image:linear-gradient(45deg,#ff00cc,#00ffff,#ffcc00);
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.navbar{
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 60px;
  box-shadow:0 0 20px rgba(255,0,255,0.4);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-weight:600;
  font-size:30px;
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(45deg,#ff00cc,#3333ff,#00ffff);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.img-logo{
  width:50px;
  height:50px;
  object-fit:cover;
  border-radius:50%;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  text-decoration:none;
  color:#ddd;
  font-size:14px;
  padding:6px 14px;
  border-radius:20px;
  transition:0.3s;
}

.nav-links a:hover,
.nav-links a.active{
  background:linear-gradient(45deg,#ff00cc,#3333ff);
  box-shadow:0 0 15px #ff00cc;
}

.profile-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  cursor:pointer;
}

</style>
</head>

<body>

<script src="C:\Users\DHRUV\OneDrive\Desktop\bootstrap-5.0.2-dist\bootstrap-5.0.2-dist\js\bootstrap.bundle.min.js"></script>

<div class="navbar">
  <div class="logo">
    <img src="image/logo.png" alt="logo" class="img-logo">
    CampusBuzz
  </div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="results.html">Results</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
    <a href="login.html" class="login-btn">Login</a>
    <a href="profile.html" id="profileLink" class="profile-btn" style="display:none;">Profile</a>
  </div>
</div>

<div class="page">

<a class="back" id="backLink" href="#">← Back to Event Details</a>

<div class="container">

<h2 id="eventTitle">Register for Event</h2>
<p>Fill out the form below to register for this event.</p>

<form id="registerForm">

<div class="form-grid">

<input type="text" id="name" placeholder="Full Name *">
<input type="email" id="email" placeholder="Email Address *">

<input type="text" id="phone" placeholder="Phone Number *">
<input type="text" id="studentId" placeholder="Student ID *">

<select id="year">
<option value="">Select Academic Year *</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
</select>

<select id="dept">
<option value="">Select Department *</option>
<option>BCA</option>
<option>BBA</option>
<option>BSC-IT</option>
</select>

<textarea id="info" rows="4" placeholder="Additional Information"></textarea>

</div>

<div class="error" id="error"></div>

<div class="actions">
<button type="button" class="cancel" onclick="history.back()">Cancel</button>
<button type="submit" class="submit">Submit Registration</button>
</div>

</form>
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const events = {
  1:"Annual Tech Symposium 2026",
  2:"Spring Cultural Fest",
  3:"Entrepreneurship Workshop",
  4:"Inter-College Sports Meet",
  5:"Coding Bootcamp",
  6:"Art Exhibition"
};

let id = 1;
let url = window.location.href;

if(url.includes("id=")){
  let parts = url.split("id=");
  if(parts[1]){
    let temp = parts[1].split("&")[0];
    if(events[temp]){
      id = temp;
    }
  }
}

document.getElementById("eventTitle").innerText =
"Register for " + events[id];

document.getElementById("backLink").href =
"event-details.html?id=" + id;

document.getElementById("registerForm").addEventListener("submit", function(e){

e.preventDefault();

let nameVal = document.getElementById("name").value.trim();
let emailVal = document.getElementById("email").value.trim();
let phoneVal = document.getElementById("phone").value.trim();
let studentVal = document.getElementById("studentId").value.trim();
let yearVal = document.getElementById("year").value;
let deptVal = document.getElementById("dept").value;

let error = document.getElementById("error");
error.innerText = "";

if(!nameVal || !emailVal || !phoneVal || !studentVal || !yearVal || !deptVal){
  error.innerText = "❌ Please fill all required fields";
  return;
}

if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)){
  error.innerText = "❌ Invalid email address";
  return;
}

if(!/^\d{10}$/.test(phoneVal)){
  error.innerText = "❌ Phone number must be exactly 10 digits";
  return;
}

alert("✅ Registration Successful!");
window.location.href = 'index.html';

});

document.addEventListener("DOMContentLoaded", function(){
  const role = localStorage.getItem("userRole");
  if(role === "student"){
    document.getElementById("profileLink").style.display = "flex";
    document.querySelector(".login-btn").style.display = "none";
  }
});

});
</script>

<footer>© 2026 College Event Website</footer>

</body>
</html>
