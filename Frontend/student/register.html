<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Registration| CampusBuzz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="image/logo.png">

<style>
*{
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  margin:0;
  background:
  linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
  url("image/event.jpg") no-repeat center center fixed; 
  background-size:cover;
  color:#fff;
}

.page{
  max-width:800px;
  margin:40px auto;
  animation:fadeUp 0.8s ease forwards;
}

.container{
  background:rgba(255,255,255,0.06);
  padding:40px;
  border-radius:18px;
  backdrop-filter:blur(12px);
  animation:fadeUp 1s ease forwards;
}

h2{
  font-size:22px;
  background:linear-gradient(45deg,#ff00cc,#00ffff,#ffcc00);
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:fadeIn 1.2s ease forwards;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:#fff;
  transition:0.3s;
}

input:focus, select:focus{
  outline:none;
  box-shadow:0 0 12px #00ffff;
  transform:scale(1.03);
}

select option{
  background:#1a1a2e;
  color:#fff;
}

.error{
  margin-top:18px;
  color:#ff4d6d;
  animation:fadeIn 0.5s ease forwards;
}

.actions{
  display:flex;
  gap:18px;
  margin-top:30px;
}

button{
  flex:1;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  border:none;
  background:linear-gradient(45deg,#ff00cc,#00ffff);
  color:#fff;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  opacity:0.9;
}

@media(max-width:768px){
  .form-grid{
    grid-template-columns:1fr;
  }
}

footer{
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  text-align:center;
  padding:20px 10px;
  font-size:14px;
  border-top:1px solid rgba(255,255,255,0.1);
  margin-top:50px;

  background-image:linear-gradient(45deg,#ff00cc,#00ffff,#ffcc00);
  background-clip:text;
  -webkit-text-fill-color:transparent;

  animation:fadeUp 1.5s ease forwards;
}

/* ===== ANIMATIONS ===== */

@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

</style>
</head>

<body>

<div class="page">

<a href="login.html" style="color:white;text-decoration:none;">← Back to Login</a>

<div class="container">
<h2>Create Your Account</h2>

<form id="registerForm">

<div class="form-grid">

<input type="text" id="name" placeholder="Full Name *" required>
<input type="email" id="email" placeholder="Email Address *" required>
<input type="text" id="phone" placeholder="Phone Number *" required>
<input type="password" id="password" placeholder="Password *" required>
<input type="password" id="confirmPassword" placeholder="Confirm Password *" required>

<select id="city" required>
<option value="">Select Your City *</option>
<option>Ahmedabad</option>
<option>Surat</option>
<option>Vadodara</option>
<option>Rajkot</option>
<option>Other</option>
</select>

<select id="role" required>
<option value="">Select Role *</option>
<option value="student">Student</option>
<option value="teacher">Teacher</option>
<option value="admin">Admin</option>
</select>

</div>

<div class="error" id="error"></div>

<div class="actions">
<button type="button" onclick="history.back()">Cancel</button>
<button type="submit">Register</button>
</div>

</form>
</div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
  e.preventDefault();

  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let password = document.getElementById("password").value;
  let confirmPassword = document.getElementById("confirmPassword").value;
  let city = document.getElementById("city").value;
  let role = document.getElementById("role").value;
  let error = document.getElementById("error");

  error.innerText = "";

  if(!name || !email || !phone || !password || !confirmPassword || !city || !role){
    error.innerText = "❌ Please fill all required fields";
    return;
  }

  if(password !== confirmPassword){
    error.innerText = "❌ Passwords do not match";
    return;
  }

  const userData = {
    name:name,
    email:email,
    phone:phone,
    city:city,
    role:role,
    password:password
  };

  localStorage.setItem("registeredUser", JSON.stringify(userData));

  alert("✅ Registration Successful! You can now login.");
  window.location.href = "login.html";
});
</script>

<footer>© 2026 College Event Website</footer>

</body>
</html>
