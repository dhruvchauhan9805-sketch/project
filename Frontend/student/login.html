<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CampusBuzz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="image/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
  linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
  url("image/event.jpg") no-repeat center center fixed; 
  background-size:cover;
}

/* ===== NAVBAR ===== */

.navbar{
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 60px;
  box-shadow:0 0 20px rgba(255,0,255,0.4);
  position:sticky;
  top:0;
  z-index:100;

  animation:fadeDown 0.8s ease forwards;
}

.logo{
  font-weight:600;
  font-size:30px;
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(45deg,#ff00cc,#3333ff,#00ffff);
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.img-logo{
  width:70px;
  height:70px;
  object-fit:cover;
}

.nav-links a{
  margin-left:25px;
  text-decoration:none;
  color:#ddd;
  font-size:14px;
  transition:all 0.3s ease;
  padding:6px 14px;
  border-radius:20px;
}

.nav-links a:hover,
.nav-links a.active{
  background:linear-gradient(45deg,#ff00cc,#3333ff);
  color:#fff;
  box-shadow:0 0 15px #ff00cc;
}

/* ===== LOGIN SECTION ===== */

.login-section{
  display:flex;
  justify-content:center;
  align-items:center;
  height:85vh;
}

.login-box{
  width:100%;
  max-width:400px;
  background:rgba(255,255,255,0.08);
  padding:40px;
  border-radius:18px;

  animation:fadeUp 1s ease forwards;
}

.login-box h2{
  text-align:center;
  margin-bottom:20px;
  animation:fadeIn 1.2s ease forwards;
}

.login-box input, select{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:10px;
  border:none;
  transition:0.3s;
}

.login-box input:focus,
.login-box select:focus{
  outline:none;
  box-shadow:0 0 10px #00ffff;
  transform:scale(1.03);
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:25px;
  background:linear-gradient(45deg,#ff00cc,#00ffff);
  color:#fff;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  opacity:0.9;
}

/* ===== FOOTER ===== */

footer{
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  text-align:center;
  padding:20px 10px;
  font-size:14px;
  border-top:1px solid rgba(255,255,255,0.1);
  margin-top:50px;

  background-image:linear-gradient(45deg,#ff00cc,#00ffff,#ffcc00);
  background-clip:text;
  -webkit-text-fill-color:transparent;

  animation:fadeUp 1.5s ease forwards;
}

/* ===== ANIMATIONS ===== */

@keyframes fadeDown{
  from{opacity:0; transform:translateY(-40px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

</style>
</head>

<body>

<div class="navbar">
  <div class="logo">
      <img src="image/logo.png" alt="logo" class="img-logo"> 
      CampusBuzz
  </div>

  <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="results.html">Results</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
      <a class="active" href="login.html">Login</a>
      <a href="profile.html" id="profileIcon" style="display:none;">
        <i class="fa-solid fa-user"></i>
      </a>
  </div>
</div>

<section class="login-section">
  <div class="login-box">
    <h2>Login Account</h2>

<form onsubmit="redirectToHome(event)">

<select id="role" required>
  <option value="">Select Role</option>
  <option value="student">Student</option>
  <option value="teacher">Teacher</option>
  <option value="admin">Admin</option>
</select>

<input type="email" id="email" placeholder="Email Address" required>
<input type="password" id="password" placeholder="Password" required>

<div style="text-align:right; margin-bottom:10px;">
  <a href="#" onclick="showForgotPassword()" style="color:#00ffff; font-size:13px;">
    Forgot Password?
  </a>
</div>

<button type="submit">Login</button>
</form>

<div id="forgotBox" style="display:none; margin-top:20px;">
  <input type="email" id="forgotEmail" placeholder="Enter Registered Email">
  <button onclick="sendOTP()">Send OTP</button>

  <div id="otpSection" style="display:none; margin-top:10px;">
    <input type="text" id="enteredOTP" placeholder="Enter OTP">
    <input type="password" id="newPassword" placeholder="Enter New Password">
    <button onclick="verifyOTP()">Verify & Reset</button>
  </div>
</div>

<div style="text-align:center;margin-top:15px;">
  <a href="register.html" style="color:#00ffff;">Register Here</a>
</div>

  </div>
</section>

<!-- JS SAME AS YOURS (UNCHANGED) -->

<script>
function redirectToHome(event){
  event.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const role = document.getElementById("role").value;
  const savedUser = JSON.parse(localStorage.getItem("registeredUser"));
  if(!savedUser){ alert("No registered user found. Please register first."); return; }
  if(email === savedUser.email && password === savedUser.password && role === savedUser.role){
      localStorage.setItem("userRole", role);
      alert("Login Successful!");
      window.location.href = "index.html";
  } else { alert("Invalid Credentials!"); }
}

let generatedOTP = "";

function showForgotPassword(){
  document.getElementById("forgotBox").style.display = "block";
}

function sendOTP(){
  const email = document.getElementById("forgotEmail").value.trim();
  const savedUser = JSON.parse(localStorage.getItem("registeredUser"));
  if(!savedUser || email !== savedUser.email){ alert("Email not registered!"); return; }
  generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
  alert("Your OTP is: " + generatedOTP);
  document.getElementById("otpSection").style.display = "block";
}

function verifyOTP(){
  const enteredOTP = document.getElementById("enteredOTP").value.trim();
  const newPassword = document.getElementById("newPassword").value.trim();
  const savedUser = JSON.parse(localStorage.getItem("registeredUser"));
  if(enteredOTP !== generatedOTP){ alert("Invalid OTP!"); return; }
  if(newPassword.length < 6){ alert("Password must be at least 6 characters."); return; }
  savedUser.password = newPassword;
  localStorage.setItem("registeredUser", JSON.stringify(savedUser));
  alert("Password Reset Successful!");
  location.reload();
}
</script>

<footer>© 2026 College Event Website</footer>

</body>
</html>
