<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event Details</title>

<style>
body{
  font-family:Poppins,sans-serif;
  background:linear-gradient(135deg,#0f0c29,#302b63,#1a1a2e);
  margin:0;
  color:#fff;
}

.page{
  max-width:1000px;
  margin:40px auto;
}

.container{
  max-width:1200px;
  margin:40px auto;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:30px;
}

.main-card,.side-card{
  background:rgba(255,255,255,0.06);
  border-radius:16px;
  padding:25px;
  border:1px solid rgba(0,255,255,0.2);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 0 30px rgba(0,255,255,0.25);
  margin-bottom:20px;
  transition:0.4s ease;
}

.main-card:hover,
.side-card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 0 45px rgba(255,0,255,0.7);
}

.main-card img{
  width:50%;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 0 25px rgba(255,0,255,0.4);
  transition:0.4s ease;
}

.main-card img:hover{
  transform:scale(1.05);
  box-shadow:0 0 40px #00ffff;
}

.badge{
  position:absolute;
  background:linear-gradient(45deg,#ff00cc,#00ffff);
  padding:6px 14px;
  border-radius:20px;
  font-size:13px;
  margin:15px;
  color:#fff;
  box-shadow:0 0 15px #ff00cc;
  animation:glowPulse 2s infinite alternate;
}

h1{
  margin:15px 0 10px;
  background:linear-gradient(45deg,#ff00cc,#00ffff,#ffcc00);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:fadeSlideUp 0.8s ease forwards;
}

h3{
  color:#00ffff;
  animation:fadeSlideUp 1s ease forwards;
}

.details p{
  font-size:14px;
  color:#ccc;
  margin:10px 0;
  line-height:1.6;
  animation:fadeSlideUp 1.2s ease forwards;
}

ul li{
  color:#ddd;
  margin:8px 0;
  animation:fadeSlideUp 1.3s ease forwards;
}

.register{
  width:100%;
  padding:14px;
  margin-top:20px;
  background:linear-gradient(45deg,#ff00cc,#3333ff);
  border:none;
  color:#fff;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,0,255,0.6);
  transition:0.4s ease;
  animation:fadeSlideUp 1.4s ease forwards;
}

.register:hover{
  transform:translateY(-6px) scale(1.05);
  box-shadow:0 0 50px #00ffff;
}

.back{
  text-decoration:none;
  color:#fff;
  transition:0.3s;
}

.back:hover{
  color:#00ffff;
  text-shadow:0 0 15px #00ffff;
}

@keyframes fadeSlideUp {
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes glowPulse{
  from{
    box-shadow:0 0 10px #ff00cc;
  }
  to{
    box-shadow:0 0 30px #00ffff;
  }
}

@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
  }
}


</style>
</head>

<body>

<script src="C:\Users\DHRUV\OneDrive\Desktop\bootstrap-5.0.2-dist\bootstrap-5.0.2-dist\js\bootstrap.bundle.min.js"></script>

    <div class="page">
    <a class="back" href="index.html">← Back to Home </a>

<div class="container">

  <div class="main-card">
    <span class="badge" id="category"></span>
    <img id="eventImg" alt="Event Image">

  <div>
